
name: Build Caddy CrowdSec

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/build.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: caddy-crowdsec-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check upstream versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail

          CADDY=$(curl -fsSL \
            https://api.github.com/repos/caddyserver/caddy/releases/latest \
            | jq -r '.tag_name | ltrimstr("v")')

          BOUNCER=$(curl -fsSL \
            https://proxy.golang.org/github.com/hslatman/caddy-crowdsec-bouncer/http/@latest \
            | jq -r '.Version')

          test -n "$CADDY"
          test "$CADDY" != "null"
          test -n "$BOUNCER"
          test "$BOUNCER" != "null"

          TAG="${CADDY}-${BOUNCER}"
          IMAGE="ghcr.io/mrtcardiffuk/caddy-crowdsec"

          echo "caddy=$CADDY" >> "$GITHUB_OUTPUT"
          echo "bouncer=$BOUNCER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether build is needed
        id: check
        shell: bash
        run: |
          IMAGE="${{ steps.versions.outputs.image }}"
          TAG="${{ steps.versions.outputs.tag }}"

          if docker manifest inspect "$IMAGE:$TAG" >/dev/null 2>&1; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Image already exists: $TAG"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image locally
        if: steps.check.outputs.needed == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: caddy-crowdsec:test
          build-args: |
            CADDY_VERSION=${{ steps.versions.outputs.caddy }}
            BOUNCER_VERSION=${{ steps.versions.outputs.bouncer }}

      - name: Verify CrowdSec modules
        if: steps.check.outputs.needed == 'true'
        run: |
          set -euo pipefail
          docker run --rm caddy-crowdsec:test \
            list-modules > modules.txt

          grep -Fx 'crowdsec' modules.txt
          grep -Fx 'http.handlers.crowdsec' modules.txt
          grep -Fx 'admin.api.crowdsec' modules.txt

      - name: Publish verified image
        if: steps.check.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${{ steps.versions.outputs.image }}"
          TAG="${{ steps.versions.outputs.tag }}"

          docker tag caddy-crowdsec:test "$IMAGE:$TAG"
          docker tag caddy-crowdsec:test "$IMAGE:latest"

          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
